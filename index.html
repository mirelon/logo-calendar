<!DOCTYPE html>
<html lang="sk">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar PDF Generator</title>
  <style>
    @page {
      size: A4 landscape;
      margin: 10mm;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
    }

    .screen-only {
      margin-bottom: 1.5rem;
    }

    #downloadBtn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 14px 40px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
      letter-spacing: 0.5px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    #downloadBtn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(102, 126, 234, 0.55);
    }

    #downloadBtn:active {
      transform: translateY(0);
      box-shadow: 0 2px 10px rgba(102, 126, 234, 0.3);
    }

    #downloadBtn::before {
      content: '📄';
      font-size: 18px;
    }

    /* ── Month page ── */
    .month-page {
      background: white;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      width: fit-content;
      max-width: 100%;
      overflow-x: auto;
    }

    .month-title {
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 3px;
      color: #1a1a2e;
      padding: 8px 0 12px;
    }

    table {
      border-collapse: separate;
      border-spacing: 4px;
    }

    td.day {
      border: 1px solid #222;
      width: 120px;
      height: 80px;
      text-align: left;
      vertical-align: top;
      padding: 8px 10px;
      font-size: 15px;
      font-weight: 600;
      color: #1a1a2e;
    }

    td.weekend {
      background: rgba(220, 50, 50, 0.06);
    }

    td.empty {
      border: none;
      width: 120px;
      height: 80px;
    }

    /* ── Print styles ── */
    @media print {

      html,
      body {
        background: white;
        width: 100%;
        height: auto;
        padding: 0;
        margin: 0;
        display: block;
      }

      .screen-only {
        display: none !important;
      }

      .month-page {
        box-shadow: none;
        border-radius: 0;
        padding: 0;
        margin: 0;
        width: 100%;
        height: 190mm;
        /* 210mm A4 height − 2 × 10mm page margin */
        display: flex;
        flex-direction: column;
        overflow: hidden;
        page-break-after: always;
        break-after: page;
      }

      .month-page:last-child {
        page-break-after: avoid;
        break-after: avoid;
      }

      .month-title {
        font-size: 16pt;
        padding: 0 0 4px;
        flex-shrink: 0;
      }

      table {
        width: 100%;
        flex: 1;
        table-layout: fixed;
      }

      td.day {
        width: auto;
        height: auto;
        padding: 6px 8px;
        font-size: 13pt;
      }

      td.empty {
        width: auto;
        height: auto;
      }

      td.weekend {
        background: rgba(220, 50, 50, 0.06) !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
    }
  </style>
</head>

<body>

  <div class="screen-only">
    <button id="downloadBtn">Download PDF</button>
  </div>

  <div id="calendar-container"></div>

  <script>
    const MONTHS_SK = [
      'JANUÁR', 'FEBRUÁR', 'MAREC', 'APRÍL', 'MÁJ', 'JÚN',
      'JÚL', 'AUGUST', 'SEPTEMBER', 'OKTÓBER', 'NOVEMBER', 'DECEMBER'
    ];

    /** Mon=0, Tue=1, … Sun=6 */
    function getDow(date) {
      return (date.getDay() + 6) % 7;
    }

    /** Number of days in a given month (0-indexed month) */
    function daysInMonth(year, month) {
      return new Date(year, month + 1, 0).getDate();
    }

    /** Build one month page: title + grid from day 1 to last day */
    function buildMonthPage(year, month) {
      const page = document.createElement('div');
      page.classList.add('month-page');

      // ── Title ──
      const title = document.createElement('div');
      title.classList.add('month-title');
      title.textContent = MONTHS_SK[month];
      page.appendChild(title);

      // ── Table ──
      const table = document.createElement('table');
      const totalDays = daysInMonth(year, month);
      const firstDow = getDow(new Date(year, month, 1)); // 0=Mon … 6=Sun

      let col = 0;
      let tr = document.createElement('tr');

      // Empty cells before day 1
      for (let c = 0; c < firstDow; c++) {
        const td = document.createElement('td');
        td.classList.add('empty');
        tr.appendChild(td);
        col++;
      }

      // Day cells
      for (let day = 1; day <= totalDays; day++) {
        const td = document.createElement('td');
        td.textContent = day;
        td.classList.add('day');
        if (col >= 5) td.classList.add('weekend');
        tr.appendChild(td);
        col++;

        if (col >= 7) {
          table.appendChild(tr);
          if (day < totalDays) {
            tr = document.createElement('tr');
            col = 0;
          }
        }
      }

      // Pad last row with empties if needed
      if (col > 0 && col < 7) {
        while (col < 7) {
          const td = document.createElement('td');
          td.classList.add('empty');
          tr.appendChild(td);
          col++;
        }
        table.appendChild(tr);
      }

      page.appendChild(table);
      return page;
    }

    function buildCalendar() {
      const today = new Date();
      const container = document.getElementById('calendar-container');
      container.innerHTML = '';

      const year = today.getFullYear();

      for (let m = 0; m < 12; m++) {
        container.appendChild(buildMonthPage(year, m));
      }
    }

    document.getElementById('downloadBtn').addEventListener('click', function () {
      window.print();
    });

    buildCalendar();
  </script>

</body>

</html>
